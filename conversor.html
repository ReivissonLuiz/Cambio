<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversor de Câmbio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="convert.css">
</head>
<body>
    <header>
        <div>
            <a href="index.html">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
        </div>
        <div>
            <p class="text_title">Faça aqui sua conversão!</p>
        </div>
        <div class="logo">
            <img src="./img/logo.png" alt="Logo do Site">
        </div>
    </header>

    <div class="conteudo">
        <div class="conversor">
            <div class="container">
                <h3>Digite o valor que deseja converter:</h3>
                <input type="number" step="0.001" id="quantia" placeholder="Digite o valor">
                
                <label>De</label>
                <select id="moedaOrigem">
                    <option value="BRL">BRL</option>
                    <option value="USD">USD</option>
                    <option value="CAD">CAD</option>
                    <option value="RUB">RUB</option>
                    <option value="JPY">JPY</option>
                </select>
                
                <label>Para</label>
                <select id="moedaDestino">
                    <option value="BRL">BRL</option>
                    <option value="USD">USD</option>
                    <option value="CAD">CAD</option>
                    <option value="RUB">RUB</option>
                    <option value="JPY">JPY</option>
                </select>

                <button class="convert-btn" onclick="convertCurrency()">Converta</button>
                <input type="text" class="result" id="result" value="Resultado" readonly>
            </div>
        </div>
    </div>

    <script src="conversor.js"></script>

    <footer class="footer">
        <div class="div_esq">
            <div class="logo">
                <img src="./img/logo.png" alt="logo">
            </div>
            <div>
                <p class="text_port">Português</p>
            </div>
        </div>

        <div class="div_dir">
            <div>
                <a href="https://github.com/ReivissonLuiz" target="_blank">
                    <img class="insta_git" src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="github">
                </a>
            </div>
            <div>
                <a href="https://www.instagram.com/reivissonlz" target="_blank">
                    <img class="insta_git" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="instagram">
                </a>
            </div>
            <div>
                <a href="https://github.com/Willy-Robert" target="_blank">
                    <img class="insta_git" src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="github">
                </a>
            </div>
            <div>
                <a href="https://www.instagram.com/willy.robert/" target="_blank">
                    <img class="insta_git" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="instagram">
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
